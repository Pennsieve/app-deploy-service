# What this app is, for the app store and the workflow builder.
application:
  name: Jupyter notebook
  description: A live JupyterLab session on the files you select. You work in the notebook in your browser; the workflow waits until you close the session.
  tags: [notebook, interactive, python]

runtime:
  # A live session, not a batch step: the workflow pauses while it runs and
  # the user reaches it through the auth proxy.
  interactive: true
  # The kind of live session (jupyter: a notebook), and the notebook's
  # language.
  sessionType: jupyter
  kernel: python
  computeTypes: [standard]

inputs:
  - name: files
    description: Files to open in the notebook, staged under input/

outputs:
  - name: files
    description: Whatever the notebook writes under output/
