      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppStoreSync'
      responses:
        '200':
          description: The updated app store application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppStoreApplication'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '5XX':
          $ref: '#/components/responses/Error'
  /store/{id}/asset:
    get:
      summary: Get app store application asset
      description: Retrieves a file from the synced content of an app store application. The asset is read from S3 using the app's source URL and the specified tag as a namespace.
      x-amazon-apigateway-integration:
        $ref: '#/components/x-amazon-apigateway-integrations/app-deploy-service'
      operationId: getAppStoreAsset
      security:
        - token_auth: []
      tags:
        - App Store
      parameters:
        - in: query
          name: organization_id
          required: false
          schema:
            type: string
          description: >
            The workspace the request is made in. Membership is verified. With
            it, apps shared with that workspace or your teams in it count;
            without it, only public apps, your own, and apps shared with you
            directly.
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: The app store application ID
        - in: query
          name: file
          required: true
          schema:
            type: string
          description: The file path to retrieve
        - in: query
          name: tag
          required: false
          schema:
            type: string
          description: The branch or tag to retrieve content from (defaults to main)
      responses:
