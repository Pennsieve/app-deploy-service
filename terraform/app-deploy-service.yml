      x-amazon-apigateway-integration:
        $ref: '#/components/x-amazon-apigateway-integrations/app-deploy-service'
      operationId: getAppStoreApplications
      security:
        - token_workspace_auth: []
      tags:
        - App Store
      parameters:
        - in: query
          name: organization_id
          schema:
            type: string
          required: true
          description: The organization ID.
        - in: query
          name: sourceUrl
          required: false
          schema:
            type: string
          description: Filter applications by source URL
        - in: query
          name: includeArchived
          required: false
          schema:
            type: boolean
            default: false
          description: >
            When false (default), archived applications are excluded from the
            response. Set to true to include archived applications.
        - in: query
          name: include
          required: false
          schema:
            type: string
          description: >
            include=deployments adds each version's deployment history. Left
            out by default: lists don't show it, and it grows with every release.
      responses:
        '200':
          description: List of app store applications
          content:
            application/json:
              schema:
