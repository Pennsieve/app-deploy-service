openapi: 3.0.1
info:
  version: "1.0"
  title: Applications API
  description: |
    This is the serverless Applications API
  termsOfService: https://docs.pennsieve.io/page/pennsieve-terms-of-use
  contact:
    name: Pennsieve Support
    email: support@pennsieve.net
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: https://api2.pennsieve.io/applications
    description: Production server
  - url: https://api2.pennsieve.net/applications
    description: Development server
tags:
  - name: Applications
    description: Manage applications
  - name: Deployments
    description: Manage application deployments
  - name: App Store
    description: App Store operations
components:
  x-amazon-apigateway-integrations:
    app-deploy-service:
      type: aws_proxy
      uri: ${app_deploy_service_lambda_arn}
      httpMethod: POST
      passthroughBehavior: when_no_match
      contentHandling: CONVERT_TO_TEXT
      payloadFormatVersion: 2.0
  securitySchemes:
    token_auth:
      type: "apiKey"
      name: "Authorization"
      in: "header"
      x-amazon-apigateway-authorizer:
        identitySource: "$request.header.Authorization"
        authorizerUri: ${authorize_lambda_invoke_uri}
        authorizerPayloadFormatVersion: "2.0"
        authorizerResultTtlInSeconds: 300
        type: "request"
        enableSimpleResponses: true
        authorizerCredentials: ${gateway_authorizer_role}
    token_workspace_auth:
      type: "apiKey"
      name: "Unused"
      in: "header"
      x-amazon-apigateway-authorizer:
        identitySource: "$request.header.Authorization,$request.querystring.organization_id"
        authorizerUri: ${authorize_lambda_invoke_uri}
        authorizerPayloadFormatVersion: "2.0"
        authorizerResultTtlInSeconds: 300
        type: "request"
        enableSimpleResponses: true
        authorizerCredentials: ${gateway_authorizer_role}
  responses:
    Unauthorized:
      description: Incorrect authentication or user has incorrect permissions.
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
    UnprocessableEntity:
      description: Unprocessable Entity
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
    Error:
      description: Server Error
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
  schemas:
    DeploymentSource:
      type: object
      properties:
        type:
          type: string
          description: The source type (e.g. git provider identifier)
        url:
          type: string
          description: The source repository URL
        tag:
          type: string
          description: The source tag or branch
        isPrivate:
          type: boolean
          description: Whether the source repository is private
        authToken:
          type: string
          description: Auth token used to access a private source repository
    DeploymentRelease:
      type: object
      properties:
        id:
          type: integer
          description: The release identifier from the source provider
    AppStoreDeployment:
      type: object
      required:
        - source
        - release
      properties:
        source:
          $ref: '#/components/schemas/DeploymentSource'
        release:
          $ref: '#/components/schemas/DeploymentRelease'
    DeployApplicationResponse:
      type: object
      properties:
        deploymentId:
          type: string
          description: The identifier of the triggered deployment
    Deployment:
      type: object
      properties:
        deploymentId:
          type: string
        applicationId:
          type: string
        releaseId:
          type: integer
        initiatedAt:
          type: string
          format: date-time
        lastStatus:
          type: string
        desiredStatus:
          type: string
        taskArn:
          type: string
        sourceUrl:
          type: string
        tag:
          type: string
        updatedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
          nullable: true
        startedAt:
          type: string
          format: date-time
          nullable: true
        stoppedAt:
          type: string
          format: date-time
          nullable: true
        stopCode:
          type: string
        stoppedReason:
          type: string
        errored:
          type: boolean
        variant:
          type: string
          description: The app variant this deployment builds (app.yml variants[].id). Absent for an app without variants.
    AppStoreVersion:
      type: object
      properties:
        uuid:
          type: string
        applicationId:
          type: string
        version:
          type: string
        releaseId:
          type: integer
        createdAt:
          type: string
        status:
          type: string
        deployments:
          type: array
          items:
            $ref: '#/components/schemas/Deployment'
        manifest:
          $ref: '#/components/schemas/AppManifest'
        manifestProblems:
          type: array
          description: "How the version's app.yml doesn't follow https://schemas.pennsieve.io/app-manifest/v1.json, as found at registration, one 'path: reason' each. Absent when it follows it."
          items:
            type: string
        license:
          type: string
          description: The repository's license at this version, an SPDX id (e.g. "MIT"), as GitHub reads its LICENSE file. Absent when there's none or it's unknown.
        citation:
          $ref: '#/components/schemas/AppCitation'
        defaultVariant:
          type: string
          description: The id of the default variant. Absent when the version's app.yml declares no variants; manifest and status are then the default variant's.
        variants:
          type: array
          description: The version's variants in app.yml order (separately built flavours of the app, e.g. CPU and GPU). Absent when its app.yml declares none.
          items:
            $ref: '#/components/schemas/AppStoreVariant'
        imageDigest:
          type: string
          description: The digest of the image built for this version (the default variant's, with variants). Absent until its build succeeds.
        lambda:
          $ref: '#/components/schemas/LambdaEligibility'
        fixtures:
          $ref: '#/components/schemas/AppFixtures'
        sampleRun:
          $ref: '#/components/schemas/AppSampleRun'
        sample:
          $ref: '#/components/schemas/AppSample'
    AppSampleRun:
      type: object
      description: The one run of the release's image on its fixture bundle, for the sample document (platform-internal results; their location is not shown). Absent until the fixtures are ready, or where no run is made.
      required: [status]
      properties:
        status:
          type: string
          enum: [running, ready, skipped, failed]
        bytes:
          type: integer
          format: int64
          description: The zipped results' size. Present when ready.
        files:
          type: integer
          description: How many files the app wrote. Present when ready.
        exitCode:
          type: integer
          description: The app's exit status, when it ran.
        durationSeconds:
          type: integer
        warnings:
          type: array
          items:
            type: string
        error:
          type: object
          description: >-
            Why there are no results. Codes for skipped: needs_hardware (GPU only, or more memory than the runner has),
            no_bundle. For failed: run_failed, timed_out, too_large, no_outputs, image_unavailable, bundle_unavailable,
            invalid_parameters, build_failed, build_timed_out, manifest_missing.
          required: [code]
          properties:
            code:
              type: string
            message:
              type: string
        finishedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AppSample:
      type: object
      description: The sample document curation-service made from the sample run. Keys are in the curation bucket, served through the platform's assets distribution (signed; public copies unsigned). Absent until there is one.
      required: [status]
      properties:
        status:
          type: string
          enum: [ready, failed]
        documentKey:
          type: string
          description: The PDF's key. Present when ready.
        previewKey:
          type: string
          description: The first page as PNG. Present when ready.
        crateKey:
          type: string
          description: The RO-Crate sidecar describing the document, its inputs and the run. Present when ready.
        sha256:
          type: string
        bytes:
          type: integer
          format: int64
        pages:
          type: integer
        figures:
          type: integer
        narrative:
          type: boolean
          description: Whether the model-written overview is in the document (false when the job's budget cut it).
        public:
          type: object
          description: For a public app, the unsigned copies under public/apps/, by kind (document, preview, crate).
          additionalProperties:
            type: string
        error:
          type: object
          description: >-
            Why there is no document: the curation job's code (no_test_data, no_outputs, results_unavailable,
            budget_blocked, internal).
          required: [code]
          properties:
            code:
              type: string
            message:
              type: string
        generatedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AppFixtures:
      type: object
      description: The release's fixture bundle, its app.yml review-block inputs built once at release for sample runs (platform-internal; the bundle's location is not shown). Absent until the version is deployed, or where the environment builds none.
      required: [status]
      properties:
        status:
          type: string
          enum: [building, ready, skipped, failed]
          description: >-
            building while a fixture build runs; ready when the bundle is in place; skipped when no build
            was started (see error); failed when the build or the fixtures failed (see error).
        bytes:
          type: integer
          format: int64
          description: The compressed bundle's size. Present when ready.
        sha256:
          type: string
          description: The bundle's SHA-256. Present when ready.
        files:
          type: integer
          description: How many input files the bundle holds. Present when ready.
        warnings:
          type: array
          description: >-
            Such as "large_bundle: ..." for a bundle above the warning size. Absent when none.
          items:
            type: string
        error:
          type: object
          description: >-
            Why there is no bundle. Codes for skipped: no_review_block, private_repository, platform_app.
            For failed: app-fixtures' own codes (no_source_for_port, dataset_too_large, generator_failed, ...),
            too_large (above the cap), build_failed, build_timed_out, manifest_missing.
          required: [code]
          properties:
            code:
              type: string
            message:
              type: string
        builtAt:
          type: string
          format: date-time
          description: When the bundle was built. Present when ready.
        updatedAt:
          type: string
          format: date-time
          description: When this record last changed.
    LambdaEligibility:
      type: object
      description: Whether the version (or variant) can run as a Lambda step, decided by the platform from its runtime and image after a successful build. Absent until then.
      required: [eligible, checkedAt]
      properties:
        eligible:
          type: boolean
        overridable:
          type: boolean
          description: True when it isn't eligible only because of declared resource limits (memory, cpu, timeoutSeconds), so a user may choose Lambda for a run anyway. False (absent) when eligible or when any other reason applies.
        reasons:
          type: array
          description: Why it can't, every reason that applies (e.g. "it runs on GPU only"). Absent when eligible.
          items:
            type: string
        imageBytes:
          type: integer
          format: int64
          description: The image's compressed size in bytes (the sum of its layers).
        checkedAt:
          type: string
          format: date-time
    AppCitation:
      type: object
      description: >
        The repository's CITATION.cff (Citation File Format 1.2.0) at this
        version, read when it was registered, with app.yml's
        application.relations applied. Absent when the repository has none or
        it couldn't be parsed (then manifestProblems says why).
      required: [authors, preferredCitation, relatedWorks]
      properties:
        title:
          type: string
        version:
          type: string
        doi:
          type: string
          description: The software's own DOI, normalised (10.5281/zenodo.1234567).
        dateReleased:
          type: string
          description: As written in CITATION.cff, e.g. 2026-10-01.
        authors:
          type: array
          items:
            $ref: '#/components/schemas/CitationAuthor'
        preferredCitation:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/RelatedWork'
          description: >
            The work to cite for the app (CITATION.cff's preferred-citation),
            also the first of relatedWorks. Null means cite the software
            itself (title, authors, version, doi).
        relatedWorks:
          type: array
          description: >
            Every work CITATION.cff lists, the preferred citation first, then
            its references in file order, each DOI once.
          items:
            $ref: '#/components/schemas/RelatedWork'
    CitationAuthor:
      type: object
      description: A person (givenNames, familyNames) or an entity such as an organisation (only name).
      required: [name]
      properties:
        name:
          type: string
          description: How the author is shown, e.g. "Sofie Van Gassen" or "Pennsieve Team".
        givenNames:
          type: string
        familyNames:
          type: string
        orcid:
          type: string
          description: The bare ORCID iD, e.g. 0000-0002-1825-0097.
        affiliation:
          type: string
    RelatedWork:
      type: object
      description: A work CITATION.cff lists, with its DataCite relation type.
      required: [doi, relationType, source]
      properties:
        doi:
          type: string
          description: >
            Normalised (lowercase, no https://doi.org/ or doi:), e.g.
            10.1038/nbt.4314. Empty for a work without a DOI, which is shown
            by its url and not sent to DataCite.
        relationType:
          type: string
          enum: [Describes, Documents, IsCitedBy, IsDerivedFrom, IsDescribedBy, IsDocumentedBy, IsMetadataFor, IsReferencedBy, IsRequiredBy, IsSourceOf, IsSupplementedBy, IsSupplementTo, IsOriginalFormOf, IsVariantFormOf, References, Requires]
          description: >
            IsDescribedBy for the preferred citation, References for a
            reference, unless app.yml's application.relations says otherwise.
        title:
          type: string
        authors:
          type: array
          items:
            type: string
        year:
          type: integer
        journal:
          type: string
        url:
          type: string
        source:
          type: string
          enum: [preferred-citation, references]
    AppStoreVariant:
      type: object
      properties:
        id:
          type: string
          description: The variant's id (app.yml variants[].id); what a workflow step and the registry's variant parameter refer to.
        name:
          type: string
        description:
          type: string
        default:
          type: boolean
          description: True for the variant a step without a variant runs.
        status:
          type: string
          description: The variant's build status (registering, deployed, error). Absent when no build is recorded for it.
        failureReason:
          type: string
          description: Why the variant's build failed, when status is error.
        manifest:
          $ref: '#/components/schemas/AppManifest'
        imageDigest:
          type: string
          description: The digest of the variant's image. Absent until its build succeeds.
        lambda:
          $ref: '#/components/schemas/LambdaEligibility'
    AppManifest:
      type: object
      description: The version's app.yml, parsed when it was registered. Absent for an app without an app.yml.
      properties:
        name:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        maintainers:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              email:
                type: string
              orcid:
                type: string
                description: The bare ORCID iD, e.g. 0000-0002-1825-0097.
        runtime:
          type: object
          properties:
            cpu:
              type: integer
              description: CPU units (1024 = 1 vCPU).
            memory:
              type: integer
              description: MiB.
            computeTypes:
              type: array
              description: standard and/or gpu. Whether the app also runs on Lambda is decided by the platform (see lambda on the version); older manifests may still list lambda.
              items:
                type: string
            timeoutSeconds:
              type: integer
            diskGiB:
              type: integer
              description: The local disk (GiB) a step needs (app.yml runtime.diskGiB), a floor on what the compute node plans.
            llm:
              type: boolean
            optimize:
              type: boolean
              description: app.yml's runtime.optimize. false runs the app only as computeTypes declares it; absent lets Pennsieve run it on an optimized runtime it fits, such as Lambda.
            interactive:
              type: boolean
              description: A human-in-the-loop app (e.g. a notebook kernel), run as a live session.
            sessionType:
              type: string
              description: The session's kind; "jupyter" is a notebook.
            kernel:
              type: string
              description: A Jupyter session's language, e.g. "python" or "r".
        parameters:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              type:
                type: string
              required:
                type: boolean
              description:
                type: string
              defaultValue:
                type: string
              validValues:
                type: array
                items:
                  type: string
        inputs:
          type: array
          items:
            $ref: '#/components/schemas/AppPort'
        outputs:
          type: array
          items:
            $ref: '#/components/schemas/AppPort'
        variant:
          type: object
          description: The variant this manifest was resolved for. Absent for an app without variants.
          properties:
            id:
              type: string
            name:
              type: string
            description:
              type: string
    AppPort:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        mediaTypes:
          type: array
          items:
            type: string
        formats:
          type: array
          description: EDAM format ids (e.g. format_3590). With no mediaTypes or formats, any file.
          items:
            type: string
    AppStoreApplication:
      type: object
      properties:
        uuid:
          type: string
        sourceUrl:
          type: string
        sourceType:
          type: string
        isPrivate:
          type: boolean
        visibility:
          type: string
        ownerId:
          type: string
        createdAt:
          type: string
        status:
          type: string
          enum: [active, archived]
          description: Lifecycle status of the application. Defaults to "active".
        latestVersionTag:
          type: string
          description: >
            Tag of the most recently created version for this application.
            Omitted when the application has no tagged versions.
        versions:
          type: array
          items:
            $ref: '#/components/schemas/AppStoreVersion'
        params:
          type: array
          items:
            $ref: '#/components/schemas/AppParameter'
          description: >
            Parameter declarations from the most recently published release's
            app.yml. Omitted when the app declares no parameters.
    AppParameter:
      type: object
      description: >
        A processor parameter declaration from app.yml.
      required:
        - name
        - required
      properties:
        name:
          type: string
        type:
          type: string
          description: Informational type hint (string, number, boolean, ...).
        required:
          type: boolean
          description: >
            Whether a value must be supplied. Mirrors app.yml's `required`
            field and is false when app.yml omits it.
        description:
          type: string
        defaultValue:
          type: string
          description: Value pre-filled in the workflow builder. Always a string.
        validValues:
          type: array
          items:
            type: string
          description: Allowed values. When present, the parameter renders as a dropdown.
    AppStoreApplicationDetail:
      type: object
      properties:
        uuid:
          type: string
        sourceUrl:
          type: string
        sourceType:
          type: string
        isPrivate:
          type: boolean
        visibility:
          type: string
        ownerId:
          type: string
        createdAt:
          type: string
        status:
          type: string
          enum: [active, archived]
          description: Lifecycle status of the application. Defaults to "active".
        latestVersionTag:
          type: string
          description: >
            Tag of the most recently created version for this application.
            Omitted when the application has no tagged versions.
        versions:
          type: array
          items:
            $ref: '#/components/schemas/AppStoreVersion'
        assets:
          type: object
          additionalProperties:
            type: string
          description: >
            Map of asset filename to content string. Includes files like
            app.yml, README.md and CITATION.cff when they exist in the synced
            repository content.
        params:
          type: array
          items:
            $ref: '#/components/schemas/AppParameter'
          description: >
            Parameter declarations parsed from the app.yml of the requested
            tag (or the latest version when tag is omitted). Omitted when the
            app.yml is missing, malformed, or declares no parameters.
    PatchAppStoreApplicationRequest:
      type: object
      properties:
        status:
          type: string
          enum: [active, archived]
          description: New lifecycle status for the application.
      required:
        - status
    AppStoreSync:
      type: object
      required:
        - source
      properties:
        source:
          $ref: '#/components/schemas/DeploymentSource'
    RegistryImageResponse:
      type: object
      properties:
        authorized:
          type: boolean
        imageUrl:
          type: string
        message:
          type: string
    RegistryImageDeniedResponse:
      type: object
      properties:
        authorized:
          type: boolean
        message:
          type: string
    AppAccess:
      type: object
      properties:
        entityId:
          type: string
        appId:
          type: string
        entityType:
          type: string
          description: The type of entity (e.g. user, team, workspace)
        entityRawId:
          type: string
        appUuid:
          type: string
        accessType:
          type: string
        organizationId:
          type: string
          nullable: true
        grantedAt:
          type: string
          format: date-time
        grantedBy:
          type: string
    AppPermissions:
      type: object
      properties:
        visibility:
          type: string
          enum:
            - public
            - private
          description: The visibility of the application
        ownerId:
          type: string
          description: The owner of the application
        access:
          type: array
          description: The list of granted accesses
          items:
            $ref: '#/components/schemas/AppAccess'
    PermissionEntity:
      type: object
      properties:
        entityId:
          type: string
        organizationId:
          type: string
    SetPermissionsRequest:
      type: object
      required:
        - visibility
      properties:
        visibility:
          type: string
          enum:
            - public
            - private
          description: The visibility to set for the application
        users:
          type: array
          description: User entities to grant access to
          items:
            $ref: '#/components/schemas/PermissionEntity'
        teams:
          type: array
          description: Team entities to grant access to
          items:
            $ref: '#/components/schemas/PermissionEntity'
        workspaces:
          type: array
          description: Workspace entities to grant access to
          items:
            $ref: '#/components/schemas/PermissionEntity'
x-amazon-apigateway-importexport-version: "1.0"
paths:
  /{id}/deployments:
    get:
      deprecated: true
      summary: List deployments
      description: Get the deployment history for an application
      x-amazon-apigateway-integration:
        $ref: '#/components/x-amazon-apigateway-integrations/app-deploy-service'
      operationId: getDeployments
      security:
        - token_workspace_auth: []
      tags:
        - Deployments
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: The application ID
        - in: query
          name: organization_id
          required: true
          schema:
            type: string
          description: The node id of the application's workspace
      responses:
        '200':
          description: List of deployments
        '404':
          $ref: '#/components/responses/NotFound'
        '4XX':
          $ref: '#/components/responses/Unauthorized'
        '5XX':
          $ref: '#/components/responses/Error'
  /{id}/deployments/{deploymentId}:
    get:
      deprecated: true
      summary: Get deployment
      description: Get the details for a specific application deployment
      x-amazon-apigateway-integration:
        $ref: '#/components/x-amazon-apigateway-integrations/app-deploy-service'
      operationId: getDeployment
      security:
        - token_workspace_auth: []
      tags:
        - Deployments
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: The application ID
        - in: path
          name: deploymentId
          required: true
          schema:
            type: string
          description: The deployment ID
        - in: query
          name: organization_id
          required: true
          schema:
            type: string
          description: The node id of the application's workspace
      responses:
        '200':
          description: The requested deployment
        '404':
          $ref: '#/components/responses/NotFound'
        '4XX':
          $ref: '#/components/responses/Unauthorized'
        '5XX':
          $ref: '#/components/responses/Error'
  /store:
    post:
      summary: Create a new app store application
      description: Create a new app store application and trigger an initial deployment for the supplied source/release.
      x-internal: true
      x-amazon-apigateway-integration:
        $ref: '#/components/x-amazon-apigateway-integrations/app-deploy-service'
      operationId: postAppStore
      security:
        - token_auth: []
