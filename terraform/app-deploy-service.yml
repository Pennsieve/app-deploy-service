  /store/{id}:
    get:
      summary: Get app store application
      description: >
        Get a single app store application by ID, including its versions,
        deployment history, repository assets (e.g. app.yml, README.md) and
        the parameter declarations parsed from app.yml for the requested tag.
      x-amazon-apigateway-integration:
        $ref: '#/components/x-amazon-apigateway-integrations/app-deploy-service'
      operationId: getAppStoreApplication
      security:
        - token_auth: []
      tags:
        - App Store
      parameters:
        - in: query
          name: organization_id
          required: false
          schema:
            type: string
          description: >
            The workspace the request is made in. Membership is verified. With
            it, apps shared with that workspace or your teams in it count;
            without it, only public apps, your own, and apps shared with you
            directly.
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: The app store application UUID
        - in: query
          name: tag
          required: false
          schema:
            type: string
          description: >
            The release tag to retrieve assets and params from. When omitted,
            defaults to the most recently created version's tag. If the
            application has no versions, assets are not fetched, an empty
            assets map is returned and params is omitted.
      responses:
        '200':
          description: The app store application with versions, deployments, assets, and params
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppStoreApplicationDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '5XX':
          $ref: '#/components/responses/Error'
    patch:
      summary: Update app store application
      description: >
        Partially update an app store application. Currently supports changing
        the lifecycle status (e.g. to "archived"). Only the application owner
        may perform this operation.
      x-amazon-apigateway-integration:
        $ref: '#/components/x-amazon-apigateway-integrations/app-deploy-service'
      operationId: patchAppStoreApplication
      security:
        - token_auth: []
      tags:
        - App Store
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: The app store application UUID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchAppStoreApplicationRequest'
      responses:
        '200':
          description: The updated app store application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppStoreApplication'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '5XX':
          $ref: '#/components/responses/Error'
  /store/registry:
    get:
      summary: App store registry lookup
      description: Resolves the image URL for an appstore application version for an authorized caller.
      x-amazon-apigateway-integration:
        $ref: '#/components/x-amazon-apigateway-integrations/app-deploy-service'
      operationId: getAppStoreRegistry
      security:
        - token_auth: []
      tags:
        - App Store
      parameters:
        - in: query
          name: organization_id
          required: false
          schema:
            type: string
          description: >
            The workspace the request is made in. Membership is verified. With
            it, apps shared with that workspace or your teams in it count;
            without it, only public apps, your own, and apps shared with you
            directly.
        - in: query
          name: sourceUrl
          required: true
          schema:
            type: string
          description: The git repository URL identifying the application
        - in: query
          name: version
          required: true
          schema:
            type: string
          description: The specific version tag (e.g. v1.0.7)
        - in: query
          name: variant
          required: false
          schema:
            type: string
          description: >
            The app variant (app.yml variants[].id). Empty or absent is the
            version's default variant, the image every caller got before
            variants. A version without variants accepts no variant.
      responses:
        '200':
          description: User is authorized to pull the image
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistryImageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: User does not have access to this application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistryImageDeniedResponse'
        '404':
          description: >
            Application or version not found, or not yet deployed. Messages:
            "application not found in app store", "version not found for this
            application", "version is not yet deployed"; with a variant:
            "version <tag> has no variants", "variant <id> not found for this
            version", "variant <id> of <tag> is not yet deployed", "variant
            <id> of <tag> failed to build".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistryImageDeniedResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '4XX':
          $ref: '#/components/responses/Unauthorized'
        '5XX':
          $ref: '#/components/responses/Error'
  /store/sync:
    post:
      summary: Sync application details
      description: >
        Syncs details (e.g. GitHub visibility) of an application.
      x-internal: true
      x-amazon-apigateway-integration:
        $ref: '#/components/x-amazon-apigateway-integrations/app-deploy-service'
      operationId: postAppStoreSync
